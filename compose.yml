name: "ddos-guard-game"
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${COMPOSE__POSTGRES__DB}
      POSTGRES_USER: ${COMPOSE__POSTGRES__USER}
      POSTGRES_PASSWORD: ${COMPOSE__POSTGRES__PASSWORD}
    ports:
      - "${COMPOSE__POSTGRES__HOST}:${COMPOSE__POSTGRES__PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COMPOSE__POSTGRES__USER} -d ${COMPOSE__POSTGRES__DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${COMPOSE__BACKEND__DATABASE_URL}
      API_CORS_ORIGINS: ${COMPOSE__BACKEND__API_CORS_ORIGINS}
      ADMIN_PASSWORD: ${COMPOSE__BACKEND__ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      - backend
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "${COMPOSE__NGINX__HOST}:${COMPOSE__NGINX__HTTP_PORT}:80"
      - "${COMPOSE__NGINX__HOST}:${COMPOSE__NGINX__HTTPS_PORT}:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
volumes:
  postgres_data:
